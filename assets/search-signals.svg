<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="256" viewBox="0 0 1200 256" role="img" aria-labelledby="title desc">
  <title id="title">Search signals</title>
  <desc id="desc">Abstract paths connect sources and answers around a search symbol.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2233"/>
      <stop offset="0.55" stop-color="#11364A"/>
      <stop offset="1" stop-color="#0A2031"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#84BED0" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#5ED6CC" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#B3F5E7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#B8DFE9" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="256" rx="22" fill="url(#background)"/>
  <rect width="1200" height="256" rx="22" fill="url(#grid)"/>

  <g fill="none" stroke="url(#signal)" stroke-width="2">
    <path d="M0 78C155 78 171 185 327 185S531 69 689 69 806 126 930 126"/>
    <path d="M0 205C156 205 207 105 354 105S535 194 700 194 792 126 930 126"/>
    <path d="M294 0C294 82 436 140 574 140S769 126 930 126" stroke-opacity="0.48"/>
    <path d="M634 256C672 205 791 196 841 158" stroke-opacity="0.42"/>
  </g>

  <g fill="#A7E9E0">
    <circle cx="146" cy="117" r="4"/>
    <circle cx="327" cy="185" r="5"/>
    <circle cx="354" cy="105" r="4"/>
    <circle cx="608" cy="80" r="4"/>
    <circle cx="700" cy="194" r="5"/>
    <circle cx="841" cy="158" r="4"/>
  </g>
  <g fill="none" stroke="#D9F8F2" stroke-opacity="0.4">
    <circle cx="327" cy="185" r="12"/>
    <circle cx="700" cy="194" r="12"/>
    <circle cx="608" cy="80" r="11"/>
  </g>

  <circle cx="970" cy="126" r="93" fill="#4DE0CC" opacity="0.12" filter="url(#glow)"/>
  <circle cx="970" cy="126" r="91" fill="none" stroke="#A5E8E2" stroke-opacity="0.14"/>
  <circle cx="970" cy="126" r="66" fill="none" stroke="#A5E8E2" stroke-opacity="0.25"/>
  <circle cx="970" cy="126" r="44" fill="#15485B" stroke="#91E4DC" stroke-width="2"/>
  <circle cx="964" cy="119" r="13" fill="none" stroke="#E6FFFA" stroke-width="4"/>
  <path d="m974 129 13 13" fill="none" stroke="#E6FFFA" stroke-width="4" stroke-linecap="round"/>
  <circle cx="970" cy="35" r="3" fill="#A7E9E0"/>
  <circle cx="1036" cy="61" r="3" fill="#A7E9E0"/>
  <circle cx="1038" cy="190" r="3" fill="#A7E9E0"/>
  <circle cx="902" cy="187" r="3" fill="#A7E9E0"/>
</svg>
